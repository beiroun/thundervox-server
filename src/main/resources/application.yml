#
# Every site-specific value comes from the environment (.env on the host, read by docker compose).
# Nothing secret is defaulted here: a missing TVX_DB_PASSWORD / TVX_SIP_DB_PASSWORD / TVX_JWT_SECRET /
# TVX_SUPERADMIN_* / TVX_SIP_REALM fails the start.
spring:
  application:
    name: thundervox-server
  datasource:
    # Schema owner. Flyway runs as this user, so it also needs CREATEROLE for V3 (the core's read-mostly role).
    url: ${TVX_DB_URL:jdbc:postgresql://127.0.0.1:5432/thundervox}
    username: ${TVX_DB_USER:thundervox}
    password: ${TVX_DB_PASSWORD}
  jpa:
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that entities match it
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    placeholders:
      # Password of the database role the SIP core logs in with (auth_db / usrloc); see V3__db_roles.sql
      tvx_sip_db_password: ${TVX_SIP_DB_PASSWORD}

server:
  # Bound to loopback by default: the edge proxy and the console's nginx reach it on the same host
  address: ${TVX_SERVER_BIND:127.0.0.1}
  port: ${TVX_SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  # TLS terminates on the edge proxy, so the scheme and the host the client used arrive in X-Forwarded-*.
  # Without this the server would build http:// links (OpenAPI server URL, redirects) behind an https name.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      base-path: /system
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /docs

# Site-local policy of this deployment; see the classes in config/ for what each value does.
tvx:
  cors:
    # Browser origins allowed to call the API cross-site, comma-separated (e.g. https://console.example.com).
    # Empty = none, which is correct whenever the console is served same-origin through its own nginx.
    allowed-origins: ${TVX_CORS_ORIGINS:}
  sip:
    # Digest realm of every SIP account = the SIP domain devices register to (TVX_SIP_DOMAIN of the core).
    # It is part of every stored HA1: changing it later invalidates all issued passwords.
    realm: ${TVX_SIP_REALM}
  console:
    # HMAC key of the console's bearer tokens, at least 32 characters. Changing it logs everybody out.
    token-secret: ${TVX_JWT_SECRET}
    token-ttl: ${TVX_CONSOLE_TOKEN_TTL:PT8H}
    # The super administrator lives in the environment: the server creates or updates that one account on every
    # start, and nobody can edit it through the API
    super-administrator:
      login: ${TVX_SUPERADMIN_LOGIN}
      password: ${TVX_SUPERADMIN_PASSWORD}

logging:
  level:
    com.ef_softworks: ${TVX_LOG_LEVEL:INFO}
