# SPDX-License-Identifier: BUSL-1.1
# Builds the image on every push to the release branch (and pull requests into it). The Dockerfile compiles the
# project, so a green build means
# the code compiles against the pinned toolchain and the image assembles. Nothing is pushed here.
name: ci

on:
  push:
    branches: ["release"]
  pull_request:
    branches: ["release"]

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # buildx and the BuildKit daemon pinned like everything else (2026-10-22): the action's default is the latest
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: thundervox-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-check the jar starts the JVM
        run: docker run --rm --entrypoint java thundervox-server:ci -version
