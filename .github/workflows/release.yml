# SPDX-License-Identifier: BUSL-1.1
# Tag vX.Y.Z -> ghcr.io/beiroun/thundervox-server:X.Y.Z. The image tag is the git tag; "latest" is never published,
# the deployment compose pins exact versions.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/beiroun/thundervox-server
          tags: type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.licenses=BUSL-1.1
            org.opencontainers.image.title=ThunderVox Server
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
