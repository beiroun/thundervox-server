# thundervox-server - local build
# ===============================
# Builds the server image from this working tree and runs it with its own PostgreSQL, for development on a
# laptop. Not the deployment: that is the umbrella repository (thundervox/deploy), which runs published images
# with host networking and real secrets. Here everything listens on loopback and the database lives in ./.local
# (gitignored), so a wipe is `rm -rf .local`.
#
# Secrets have no defaults in this file: copy .env.example to .env (gitignored) and fill it, compose refuses to
# start while one of them is missing.
#
#   cp .env.example .env                 then fill the secrets (openssl rand -hex 16 / -hex 32)
#   docker compose up --build            build the jar in Docker and start postgres + server
#   docker compose up --build -d         the same, detached; logs: docker compose logs -f server
#   docker compose down                  stop; the database directory stays
#   rm -rf .local && docker compose up   start from an empty database (migrations run again)
#
# Then: http://127.0.0.1:8080/api/v1/docs (Swagger UI), console login TVX_SUPERADMIN_LOGIN (admin by default) with
# TVX_SUPERADMIN_PASSWORD from .env, `npm run dev` in thundervox-web proxies /api here.
# psql: psql -h 127.0.0.1 -U thundervox thundervox (password: TVX_DB_PASSWORD from .env).
#
# Every TVX_* value can be overridden from the shell or the .env file next to this file.

name: thundervox-local

services:
  postgres:
    image: postgres:18
    container_name: thundervox-local-postgres
    environment:
      POSTGRES_DB: thundervox
      POSTGRES_USER: thundervox              # schema owner; Flyway runs as it and needs CREATEROLE for V3 - a superuser here
      POSTGRES_PASSWORD: "${TVX_DB_PASSWORD:?set TVX_DB_PASSWORD in .env}"
      TZ: "Asia/Omsk"
    ports:
      - "127.0.0.1:5432:5432"                # psql and IDE database tools from the laptop
    volumes:
      # Bind mount, not a named volume: the data is visible as files and dies with `rm -rf .local`.
      # postgres:18 keeps PGDATA at /var/lib/postgresql/18/docker; the parent is what the image declares.
      - ./.local/postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thundervox -d thundervox"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  server:
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-0.0.0-local}"   # what GET /info and the console footer show
    image: thundervox-server:local
    container_name: thundervox-local-server
    environment:
      TVX_DB_URL: "jdbc:postgresql://postgres:5432/thundervox"
      TVX_DB_USER: "thundervox"
      TVX_DB_PASSWORD: "${TVX_DB_PASSWORD:?set TVX_DB_PASSWORD in .env}"
      TVX_SIP_DB_PASSWORD: "${TVX_SIP_DB_PASSWORD:?set TVX_SIP_DB_PASSWORD in .env}"   # role the core logs in with (created by migration V3)
      # 0.0.0.0 inside the container, published on loopback only (see ports): the laptop reaches it as 127.0.0.1:8080
      TVX_SERVER_BIND: "0.0.0.0"
      TVX_SERVER_PORT: "8080"
      # Vite's dev server proxies /api to this port, so the console is same-origin and needs no CORS. Set it
      # only for a browser calling the API on another origin directly.
      TVX_CORS_ORIGINS: "${TVX_CORS_ORIGINS:-}"
      TVX_LOG_LEVEL: "${TVX_LOG_LEVEL:-DEBUG}"
      # Digest realm hashed into every issued SIP password. A dev value: numbers made here work only against a
      # core whose TVX_SIP_DOMAIN is the same name.
      TVX_SIP_REALM: "${TVX_SIP_REALM:-sip.thundervox.local}"
      # Console access: at least 32 characters for the secret, 12 for the password, as the server requires
      TVX_JWT_SECRET: "${TVX_JWT_SECRET:?set TVX_JWT_SECRET in .env}"
      TVX_SUPERADMIN_LOGIN: "${TVX_SUPERADMIN_LOGIN:-admin}"
      TVX_SUPERADMIN_PASSWORD: "${TVX_SUPERADMIN_PASSWORD:?set TVX_SUPERADMIN_PASSWORD in .env}"
      TVX_CONSOLE_TOKEN_TTL: "${TVX_CONSOLE_TOKEN_TTL:-PT8H}"
      # Internal API for the SIP core (/internal/**, header X-CORE-TOKEN), so a local core or curl can ask for wake
      # pushes. Service API tokens are issued on the Integration page, not here.
      TVX_CORE_TOKEN: "${TVX_CORE_TOKEN:?set TVX_CORE_TOKEN in .env}"
      # Address shown on the Integration page next to the endpoint links
      TVX_PUBLIC_API_URL: "${TVX_PUBLIC_API_URL:-http://127.0.0.1:8080/api/v1}"
      TZ: "Asia/Omsk"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
